name: Delete and Recreate Staging Branch

on:
  workflow_run:
    workflows:
      - "CI/CD Website production"
    types:
      - completed
    branches:
      - main

jobs:
  update_staging:
    # a failed production deploy leaves staging as it is
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure script is executable
        run: chmod +x .github/workflows/scripts/jobs/recreate-staging.sh

      - name: Delete and recreate staging branch
        run: .github/workflows/scripts/jobs/recreate-staging.sh
