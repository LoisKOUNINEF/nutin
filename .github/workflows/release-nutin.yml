name: Publish nutin Package To NPM

on:
  push:
    tags:
      - "cli-v*"

concurrency:
  group: release-nutin
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish nutin Package
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Ensure tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./packages/nutin/package.json').version")"
          if [ "${GITHUB_REF_NAME#cli-v}" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: List package contents
        working-directory: packages/nutin
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/nutin
        run: npm publish --access public
