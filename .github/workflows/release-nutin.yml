name: Publish nutin Package To NPM

on:
  push:
    tags:
      - "cli-v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish Nutin Package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
#          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
#            echo "❌ Tag $GITHUB_REF_NAME is not on main. Aborting publish to npm workflow."
#            exit 1
#          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Ensure tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./packages/nutin/package.json').version")"
          if [ "${GITHUB_REF_NAME#cli-v}" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi

      # Publish from the package dir (same shape as a11y-elements' release.yml)
      # rather than `--workspace` from the monorepo root.
      - name: List package contents
        working-directory: packages/nutin
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/nutin
        # verbose: npm only logs *why* the OIDC token exchange failed at this level
        run: |
          echo "id-token request available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npm -v
          npm publish --access public --loglevel verbose
