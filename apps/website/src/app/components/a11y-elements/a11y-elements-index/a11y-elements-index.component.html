<div class="a11y-index">
  <h1 data-i18n="a11y-elements-index.title"></h1>
  <p class="a11y-index__lead" data-i18n="a11y-elements-index.lead"></p>
  <p class="a11y-index__lead" data-i18n="a11y-elements-index.sublead"></p>
  <div class="a11y-index__pitch">
    <p data-i18n="a11y-elements-index.light-dom"></p>
    <p data-i18n="a11y-elements-index.cdn"></p>
  </div>
  <div class="home-extras">
    <div class="grid">
      <div class="card pillar-card card-link" data-event="click:navigateTo:elements">
        <!-- checked box: form controls and inline elements -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <path d="M9 12l2 2l4 -4"/>
        </svg>
        <p data-i18n="a11y-elements-index.elements-title" class="card-title"></p>
        <p data-i18n="a11y-elements-index.elements-desc" class="card-desc"></p>
      </div>

      <div class="card pillar-card card-link" data-event="click:navigateTo:overlays">
        <!-- stacked layers: content floating above the page -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4l8 4l-8 4l-8 -4z"/>
          <path d="M4 12l8 4l8 -4"/>
          <path d="M4 16l8 4l8 -4"/>
        </svg>
        <p data-i18n="a11y-elements-index.overlays-title" class="card-title"></p>
        <p data-i18n="a11y-elements-index.overlays-desc" class="card-desc"></p>
      </div>
    </div>
  </div>

  <section class="a11y-index__section">
    <h2 data-i18n="a11y-elements-index.zero-build-title"></h2>
    <p data-i18n="a11y-elements-index.zero-build-desc"></p>
    <span data-component="snippet-zero-build"></span>
  </section>

  <section class="a11y-index__section">
    <h2 data-i18n="a11y-elements-index.bundler-title"></h2>
    <p data-i18n="a11y-elements-index.bundler-desc"></p>
    <span data-component="snippet-bundler"></span>
  </section>

  <section class="a11y-index__section">
    <h2 data-i18n="a11y-elements-index.styling-title"></h2>
    <p data-i18n="a11y-elements-index.styling-desc"></p>
    <span data-component="snippet-styling"></span>
  </section>
</div>
